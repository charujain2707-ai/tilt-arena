<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tilt Arena</title>
<link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#1d6b57">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#10201b;--felt:#1d6b57;--wood:#6b4428;--ink:#f3efe6;--soft:#b7c9c0;--gold:#ffc94a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:17px/1.5 "IBM Plex Sans",system-ui,sans-serif;padding:24px}
.table{max-width:560px;width:100%;background:var(--felt);border:16px solid var(--wood);border-radius:28px;padding:32px}
h1{font:800 3rem/1 "Bricolage Grotesque",sans-serif;margin:0 0 8px}
p{color:var(--soft);margin:0 0 26px}
a{display:block;text-decoration:none;color:#10201b;background:var(--gold);font-weight:600;padding:15px 18px;border-radius:12px;margin-bottom:12px}
a.alt{background:transparent;color:var(--ink);border:2px solid var(--soft)}
a:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<main class="table">
  <h1>Tilt Arena</h1>
  <p>Roll your ball by tilting your phone. Grab stars, jump over holes, first to 10 wins.</p>
  <a href="/game.html">Open the game on this laptop</a>
  <a class="alt" href="/controller.html">Use this phone as a controller</a>
</main>
</body>
</html>
